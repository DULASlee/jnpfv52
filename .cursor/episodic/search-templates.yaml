# episodic-memory 默认检索模板（Agent sessionStart 注入 + 按需 search）
# project filter：见 project_id（与 toolchain.manifest.json 一致）

project_id: D--JNPF-v52

templates:
  - id: session-resume
    when: 每次新会话
    query: ["JNPF-v52", "决策", "待审"]
    limit: 5

  - id: demo
    when: 客户演示 / v52-demo
    query: ["演示", "v52", "大屏"]
    limit: 5

  - id: backend-startup
    when: API 启动 / 数据库
    query: ["ConnectionStrings", "5000", "SqlServer"]
    limit: 5

  - id: frontend
    when: PC/大屏前端
    query: ["jnpf-web-vue3", "datascreen", "token"]
    limit: 5

  - id: iot-mes
    when: IoT/MES 架构决策
    query: ["IoT", "设备接入", "MES", "工单"]
    limit: 5

  - id: pipeline-sse
    when: SSE/EventSource/流水线连接超时/AI聊天流式
    query: ["SSE", "EventSource", "/dev", "apiUrl", "连接超时", "studio/pipeline/execute", "AIDevelopmentPipelineService"]
    limit: 5

  - id: conventions
    when: 命名约定/代码规范/Git 工作流
    query: ["命名约定", "editorconfig", "git工作流"]
    limit: 5

  - id: toolchain
    when: 工具链/OpenSpec/Superpowers 分工
    query: ["OpenSpec", "Superpowers", "toolchain"]
    limit: 5
