# =============================================================================
# JNPF V5.2 — Nginx Production Configuration
# =============================================================================
# Referenced by: docker-compose.production.yml → jnpf-web-vue3 service
#
# 缓存策略:
#   - ReportServer GET 请求: 30s 短期缓存（报表列表变化不频繁）
#   - 静态资源: gzip_static 预压缩
# =============================================================================

# ── 代理缓存路径定义（必须在 server 块外） ──
proxy_cache_path /var/cache/nginx/jnpf levels=1:2 keys_zone=jnpf_report_cache:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen       80;
    server_name  localhost;
    root /wwwroot/jnpfsoft/jnpf-web-vue3;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Upload size
    client_max_body_size 100m;

    # Proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    real_ip_header X-Real-IP;
    proxy_connect_timeout 300;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /DataV {
        try_files $uri $uri/ /DataV/index.html;
    }

    # Backend API (Docker Compose service: api)
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # ── ReportServer API 缓存（加速报表列表查询） ──
    # 生产环境中 reportServer = VITE_GLOB_API_URL + '/ReportServer' = /api/ReportServer
    # nginx 的 location 匹配优先级：精确匹配 > 前缀匹配，所以 /api/ReportServer/ 优先于 /api/
    location /api/ReportServer/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;

        # 仅缓存 GET/HEAD 请求（列表查询、报表获取）
        proxy_cache jnpf_report_cache;
        proxy_cache_valid 200 30s;          # 成功响应缓存 30 秒
        proxy_cache_valid 404 10s;          # 404 短缓存
        proxy_cache_key "$uri$is_args$args"; # 按 URL+查询参数 区分缓存
        proxy_cache_lock on;                 # 并发请求合并，避免缓存击穿
        proxy_cache_lock_timeout 5s;

        # 跳过缓存的条件（非 GET 请求、带 Authorization 的请求）
        proxy_cache_methods GET HEAD;
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;

        # 调试头：响应中标注缓存状态 (HIT/MISS/EXPIRED)
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # WebSocket (SignalR)
    location /websocket {
        proxy_pass http://api:80/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # Swagger disabled in production
    location /swagger {
        return 404;
    }
}
