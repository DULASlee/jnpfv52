# =============================================================================
# JNPF V5.2 — Nginx Production Configuration
# =============================================================================
# Referenced by: docker-compose.production.yml → jnpf-web-vue3 service
# =============================================================================

server {
    listen       80;
    server_name  localhost;
    root /wwwroot/jnpfsoft/jnpf-web-vue3;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Upload size
    client_max_body_size 100m;

    # Proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    real_ip_header X-Real-IP;
    proxy_connect_timeout 300;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /DataV {
        try_files $uri $uri/ /DataV/index.html;
    }

    # Backend API (Docker Compose service: api)
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # WebSocket (SignalR)
    location /websocket {
        proxy_pass http://api:80/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # Swagger disabled in production
    location /swagger {
        return 404;
    }
}
