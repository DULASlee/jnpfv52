# =============================================================================
# JNPF V5.2 — Nginx Staging Configuration
# =============================================================================
# Referenced by: docker-compose.staging.yml → jnpf-web-vue3 service
# =============================================================================

proxy_cache_path /var/cache/nginx/jnpf levels=1:2 keys_zone=jnpf_report_cache:10m max_size=100m inactive=10m use_temp_path=off;

server {
    listen       80;
    server_name  localhost;
    root /wwwroot/jnpfsoft/jnpf-web-vue3;
    index index.html;

    gzip on;
    gzip_static on;
    gzip_min_length 1k;
    gzip_comp_level 4;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/json application/javascript text/javascript;
    gzip_vary on;
    gzip_http_version 1.0;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # Upload size
    client_max_body_size 100m;

    # Proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-NginX-Proxy true;
    real_ip_header X-Real-IP;
    proxy_connect_timeout 300;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /DataV {
        try_files $uri $uri/ /DataV/index.html;
    }

    # Backend API (Docker Compose service: api)
    location /api/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    # ReportServer API 缓存
    location /api/ReportServer/ {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_cache jnpf_report_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_key "$uri$is_args$args";
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_methods GET HEAD;
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # WebSocket (SignalR)
    location /websocket {
        proxy_pass http://api:80/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
    }

    # Swagger (staging only)
    location /swagger {
        proxy_pass http://api:80/swagger;
        proxy_http_version 1.1;
    }
}
