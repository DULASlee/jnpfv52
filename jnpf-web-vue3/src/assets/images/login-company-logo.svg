  <text x="96" y="38" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" letter-spacing="3">面包树科技</text>
  <!-- Subtitle: BREADTREE TECH -->
  <text x="96" y="52" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" fill="rgba(255,255,255,0.7)" letter-spacing="2">BREADTREE TECH</text>
