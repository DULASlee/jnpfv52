<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#2E7D32"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
  </defs>
  <!-- Breadfruit tree canopy -->
  <ellipse cx="48" cy="22" rx="38" ry="18" fill="url(#g2)" opacity="0.9"/>
  <ellipse cx="38" cy="18" rx="22" ry="12" fill="url(#g)" opacity="0.85"/>
  <ellipse cx="58" cy="20" rx="20" ry="11" fill="#81C784" opacity="0.7"/>
  <!-- Trunk -->
  <rect x="44" y="30" width="8" height="16" rx="3" fill="#795548"/>
