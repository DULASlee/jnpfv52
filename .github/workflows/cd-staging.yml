# =============================================================================
# JNPF V5.2 - Staging Deployment Workflow
# =============================================================================
# Triggers on push to develop branch or manual dispatch
# Deploys to staging environment
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before deployment'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Run Tests
  # ---------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run backend tests
        run: |
          dotnet restore backend/JNPF.sln
          dotnet test backend/JNPF.sln --configuration Release --verbosity normal

  # ---------------------------------------------------------------------------
  # Build Docker Images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')

    strategy:
      matrix:
        service:
          - name: api
            context: ./backend
            dockerfile: application/JNPF.API.Entry/Dockerfile.staging
          - name: web
            context: ./jnpf-web-vue3
            dockerfile: Dockerfile.staging
          - name: datascreen
            context: ./jnpf-web-datascreen
            dockerfile: Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.context }}/${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Staging
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/jnpf' }}

            # Pull latest images
            docker compose -f docker-compose.staging.yml pull

            # Create .env file from secrets
            cat > .env.staging << EOF
            ENVIRONMENT=staging
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=${{ vars.DB_NAME || 'jnpf_v52_staging' }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            CORS_ORIGINS=${{ vars.CORS_ORIGINS }}
            LOG_LEVEL=${{ vars.LOG_LEVEL || 'Information' }}
            EOF

            # Deploy with zero downtime
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Wait for health checks
            sleep 30

            # Verify deployment
            docker compose -f docker-compose.staging.yml ps
            curl -f http://localhost:5000/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "::notice::Staging deployment successful"
          echo "URL: ${{ vars.STAGING_URL }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "::error::Staging deployment failed"
