# ArchGuard 规则表 — 阶段四 A2 唯一配置源
# 消费者：ArchGuardService.ScanAsync（正则/路径 MVP；Roslyn 分析器推迟阶段六）
# Critical > 0 → AbortSkillChainException，禁止启动 tester-skill

version: "1.0"
engine: regex-path-mvp
updated: "2026-07-04"

rules:
  - id: AG-000
    severity: critical
    name: channel-c-write-outside-custom
    description: 通道 C（LLM/手写）写入非 *.custom.cs
    targets:
      - path_glob: "workspace/generated/**/backend/**/*.cs"
    detect:
      type: path-convention
      forbidden_patterns:
        - "**/Services/*.cs"
      allowed_exceptions:
        - "**/Services/*Service.cs"
        - "**/Services/*Service.custom.cs"
      channel_c_allowed_suffix: ".custom.cs"
    message: "通道 C 禁止写入 {filePath}；仅允许 Services/{{ClassName}}Service.custom.cs"
    fix: "将扩展代码移至同名 partial 文件 *.custom.cs；勿修改 [GeneratedCode] 骨架"

  - id: AG-001
    severity: critical
    name: ddl-layer-violation-controller-ref
    description: 生成代码或 DDL 片段中出现 Controller 层错误引用
    targets:
      - path_glob: "workspace/generated/**/backend/**/*.cs"
      - fragment_type: IR2_DDL
    detect:
      type: regex
      pattern: "REFERENCES\\s+.*Controller|FOREIGN\\s+KEY.*Controller"
      flags: ignoreCase
    message: "检测到 DDL/代码层违规引用 Controller：{match}"
    fix: "外键应指向表名而非 Controller；见 ConstraintEngine C-001"

  - id: AG-002
    severity: critical
    name: service-missing-tenant-filter
    description: Service 生成物缺少多租户过滤模式
    targets:
      - path_glob: "workspace/generated/**/backend/Services/*Service.cs"
    detect:
      type: regex-all-required
      patterns:
        - "ITenantFilter|F_TenantId|TenantId"
      require_any: true
    message: "Service {filePath} 未检测到 ITenantFilter / TenantId 相关模式"
    fix: "Entity 实现 ITenantFilter；Service 查询须带租户条件；见 R4 多租户红线"

  - id: AG-003
    severity: critical
    name: sql-missing-tenant-parameter
    description: 动态 SQL 字符串缺少租户参数
    targets:
      - path_glob: "workspace/generated/**/backend/**/*.cs"
    detect:
      type: regex-negative
      when_file_contains: "(SqlSugar|ExecuteCommand|Ado\\.SqlQuery|FromSql)"
      must_also_contain_any:
        - "F_TenantId"
        - "@TenantId"
        - "_tenant\\."
        - "TenantId"
    message: "文件 {filePath} 含动态 SQL 但未发现 F_TenantId/@TenantId 租户绑定"
    fix: "所有原生 SQL 必须参数化并绑定当前租户 ID"

  - id: AG-W01
    severity: warning
    name: namespace-module-prefix
    description: 命名空间未含模块前缀（OaLeave 等）
    targets:
      - path_glob: "workspace/generated/**/backend/**/*.cs"
    detect:
      type: regex
      pattern: "namespace\\s+JNPF\\.(Generated|Temp)\\b"
      flags: ignoreCase
    message: "命名空间 {match} 建议使用 IR2_Architecture.modules[].name 作为前缀"
    fix: "在 TemplateContextBuilder 中从 Architecture 片段解析 NameSpace"

  - id: AG-W02
    severity: warning
    name: custom-partial-orphan
    description: 存在 custom.cs 但缺少对应 generated Service 骨架
    targets:
      - path_glob: "workspace/generated/**/backend/Services/*.custom.cs"
    detect:
      type: sibling-file-missing
      sibling_pattern: "{basename}.cs"
      strip_suffix: ".custom.cs"
    message: "孤立 custom 文件 {filePath}；缺少配对骨架 {expectedSibling}"
    fix: "先跑 developer-skill 生成骨架，或删除过时 custom 后重跑"

  - id: AG-W03
    severity: warning
    name: auto-generated-header-missing
    description: 通道 A/B 文件缺少 auto-generated 标记
    targets:
      - path_glob:
          - "workspace/generated/**/backend/Entities/*.cs"
          - "workspace/generated/**/backend/Services/*Service.cs"
          - "workspace/generated/**/backend/Interfaces/I*.cs"
    detect:
      type: regex-negative
      must_contain: "<auto-generated>"
      skip_glob: "**/*.custom.cs"
    message: "{filePath} 缺少 // <auto-generated> 文件头"
    fix: "VmTemplateRenderer 输出应注入标准文件头；禁止手改通道 A/B 文件"

execution:
  critical_action: AbortSkillChainException
  warning_action: attach-to-tester-metadata
  scan_order:
    - AG-000
    - AG-001
    - AG-002
    - AG-003
    - AG-W01
    - AG-W02
    - AG-W03

references:
  partial_class_policy: "docs/AI原生开发/1、多用户多任务并行/12-附、codegen-partial-class.md"
  constraint_engine_c001: "JNPF.InteAssistant.Constraints.ConstraintEngineService"
  phase_plan: "docs/AI原生开发/1、多用户多任务并行/12、全链条第四阶段开发计划.md §4.4"
