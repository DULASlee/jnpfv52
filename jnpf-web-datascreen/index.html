<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/css/loading.css">
  <link rel="stylesheet" href="/cdn/iconfont/iconfont.css">
  <link rel="stylesheet" href="/cdn/animate/3.5.1/animate.css">
  <script src="/components.js"></script>
  <script src="/config.js"></script>
  <script src="/cdn/staticfile/FileSaver.min.js" integrity="sha384-h+zwIp6VsQy9EE3fM+7apxmkC3M2odX+oPxGS8pdrT/WD4xByal2yiyZO5impixI" crossorigin="anonymous"></script>
  <script src="/cdn/staticfile/xlsx.full.min.js" integrity="sha384-mZyXc6Y9wsuZsdflgD0jSY6ZUAeFt5RgJhOURuQAkgD8L3sqbouYm/rlfqZMJFNa" crossorigin="anonymous"></script>
  <script src="/cdn/staticfile/jszip.min.js" integrity="sha384-wj2H3JPCraDV2eZ/vqVPAvEIkFv7WCZAac4WV7Gt/hfpso4sCcOuARI3O2rRqFV0" crossorigin="anonymous"></script>
  <script src="/cdn/html2canvas/html2canvas.min.js" integrity="sha384-XwGqoxmMMF8xk+Ej2su/exIBtJNvi1IFICihFq7toL+pib3rpsG8UKzU6tnBvgl6" crossorigin="anonymous"></script>
  <script src="/cdn/qrious.min.js" integrity="sha384-qvr/YG/FEYF/HxNiF/RNZ0cHPlC48zSPi5v+e1bfGxYUnOv3SMuJPYr3YWkNOOR4" crossorigin="anonymous"></script>
  <script src="/cdn/jquery.min.js" integrity="sha384-KxuUddbTnrg2/SuncQOQt1El1JQbQvU1AY6Hwac8IfoIFqwKPaVM1SpZk6m4HXP9" crossorigin="anonymous"></script>
  <script src="/cdn/echarts/5.4.0/echarts.min.js" integrity="sha384-GYKGXXjsXWwFU6JsQSWjcxpzP6FevNGsPme83ZlP143uoZ+n/sqqKgPHicK/7eRL" crossorigin="anonymous"></script>
  <script src="/cdn/echarts-wordcloud.min.js" integrity="sha384-+fO65m/fZOoRmhJrsT/eYi2vG6QvZcio/NMUINNKPz9Qqeej5EKkeSLBpjr1KBar" crossorigin="anonymous"></script>
  <script src="/cdn/echarts-gl.min.js" integrity="sha384-+oyoLxIbTXr6D1knGx5nrCVGFD2VcfNwha4XFzapxPPebT7P8lTsR5N+VodN+e5f" crossorigin="anonymous"></script>
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
    }
    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background-color: #151a26;
    }
    #loader-wrapper .loader-box {
      position: fixed;
      left: calc(50% - 250px);
      top: calc(50% - 100px);
      margin: 0 auto;
      width: 500px;
      height: 200px;
      text-align: center;
      vertical-align: center;
      font-weight: bold;
      color: #87888E;
      font-size: 35px;
    }
    #loader-wrapper .loader-box>span {
      opacity: 0.4;
      display: inline-block;
      animation: bouncingLoader 1s infinite alternate;
    }
    #loader-wrapper .loader-box>span:nth-child(2) {
      animation-delay: 0.1s;
    }
    #loader-wrapper .loader-box>span:nth-child(3) {
      animation-delay: 0.15s;
    }
    #loader-wrapper .loader-box>span:nth-child(4) {
      animation-delay: 0.2s;
    }
    #loader-wrapper .loader-box>span:nth-child(5) {
      animation-delay: 0.25s;
    }
    #loader-wrapper .loader-box>span:nth-child(6) {
      animation-delay: 0.3s;
    }
    #loader-wrapper .loader-box>span:nth-child(7) {
      animation-delay: 0.35s;
    }
    #loader-wrapper .loader-box>span:nth-child(8) {
      animation-delay: 0.4s;
    }
    @keyframes bouncingLoader {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(25px);
      }
      100% {
        transform: translateY(0);
      }
    }
    #loader-wrapper .load_title {
      font-weight: bold;
      z-index: 1002;
      position: absolute;
      top: 50%;
      margin-top: 15px;
      color: #87888E;
      font-size: 18px;
      width: 100%;
      height: 30px;
      text-align: center;
      opacity: 0.4;
      line-height: 30px;
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div class="loader-box">
        <span>JNPF</span>
        <span>智</span>
        <span>慧</span>
        <span>可</span>
        <span>视</span>
        <span>化</span>
        <span>大</span>
        <span>屏</span>
      </div>
      <div class="load_title">加载中…</div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
