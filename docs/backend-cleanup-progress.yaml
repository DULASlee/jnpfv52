# ============================================================
# 豁免汇总 (架构性决策)
# ============================================================
exemptions:
  - category: "static-facade"
    files: ["L.cs", "JSON.cs", "Oops.cs", "IM.cs", "FS.cs", "IDGen.cs", "Http.cs", "JsonHelper.cs"]
    reason: "JNPF 框架的静态 facade 模式，通过 App.RootServices 解析。这些是框架基础设施，改 DI 会打破现有 API。评估为架构性豁免，阶段二讨论。"

  - category: "static-internal"
    files: ["HttpRequestPartMethods.cs", "ViewEnginePartMethods.cs", "IConfigurationExtenstions.cs", "DataValidator.cs"]
    reason: "框架内部静态方法，只有框架本身调用。改 DI 会增加复杂度而无实际收益。"

  - category: "options-resolution"
    files: ["ConnectionStringsOptions.cs (x2)", "Native.cs"]
    reason: "配置/Option 类需要在非 DI 上下文中解析服务。"

  - category: "db-provider"
    files: ["SqlSugarDbContextProvider.cs"]
    reason: "数据库上下文提供器自身就是管理租户上下文的，无法通过自身注入自身。"

