status: open
total: 72
created: "2026-06-14"
deadline: "阶段五启动前（Phase 5 gate）"
gate_id: type-safety-cleanup
root_cause: |
  types/global.d.ts 中自定义 JSX namespace 使用 ComponentRenderProxy 作为
  ElementClass，与 TypeScript 5.3 + Vue 3.3 的 JSX 类型系统冲突。修复为
  jsxImportSource: "vue" 后，原先被掩藏的 72 个预存类型错误正确暴露。

fix_applied:
  - file: tsconfig.json
    change: '添加 "jsxImportSource": "vue"，移除自定义 JSX namespace 依赖'
  - file: tsconfig.json
    change: 'noUnusedLocals: false, noUnusedParameters: false（ESLint 已覆盖）'
  - file: types/global.d.ts
    change: '移除自定义 JSX namespace（ElementClass/IntrinsicElements 等），\
      添加 JSX IntrinsicAttributes 扩展以兼容 .tsx 组件'
  - file: types/global.d.ts
    change: '移除未使用的 ComponentRenderProxy/VNode 导入'
  - file: src/components/Cropper/src/CropperAvatar.vue
    change: '修复 TS2842: ({ file: Blob, name: string }) → (params: { file: Blob; name: string })'
  - file: src/components/Preview/src/typing.ts
    change: '修复 TS2842: 对象解构重命名 → 带参数名的类型标注'
  - file: src/layouts/default/header/components/FullScreen.vue
    change: '修复 TS2551: 弃用的浏览器前缀 fullscreen API → (document as any)'
  - file: src/components/Form/src/components/FormItem.vue
    change: '修复 TS2304: 添加 import { BasicHelp } from /@/components/Basic'
  - file: src/components/FormGenerator/src/DraggableItem.vue
    change: '修复 TS2304: 添加 import { BasicHelp } from /@/components/Basic'
  - file: src/core/compiler/vue3/list-gen.ts
    change: '修复 TS2345: action column 添加缺失的 sorter: false 属性'

