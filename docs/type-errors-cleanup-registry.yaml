# ============================================================
# 修复原则（来自创始人审核决定）
# ============================================================

principles:
  - 逐文件修复，每次修1-2个文件，不批量改
  - 先理解后修 — 必须理解该组件的业务契约再改类型标注，不能随意加 'as any' 或 '!'
  - 不能引入回归 — 每修复一个文件，必须确认该文件对应的 ESLint + 编译通过
  - 不能改业务逻辑 — 只改类型标注，不改运行时行为
