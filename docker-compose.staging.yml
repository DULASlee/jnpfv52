# =============================================================================
# JNPF V5.2 - Staging Environment Docker Compose
# =============================================================================
# Usage:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#   docker compose -f docker-compose.staging.yml down
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SQL Server Database
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jnpf-sqlserver-staging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-Staging@2024!}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data_staging:/var/opt/mssql
      - ./backend/web/jnpf_sundial_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - jnpf-staging
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jnpf-redis-staging
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_staging:/data
    networks:
      - jnpf-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Backend API (Main)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: application/JNPF.API.Entry/Dockerfile.staging
      args:
        - BUILD_ENV=Staging
    container_name: jnpf-api-staging
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_NAME:-jnpf_v52_staging};User Id=${DB_USER:-sa};Password=${DB_PASSWORD:-Staging@2024!};TrustServerCertificate=true
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD:-},defaultdatabase=${REDIS_DB:-0}
      - JWT__SecretKey=${JWT_SECRET_KEY:-StagingSecretKey2024!@#$%^&*()}
      - JWT__Issuer=${JWT_ISSUER:-JNPF}
      - JWT__Audience=${JWT_AUDIENCE:-JNPF}
      - Logging__LogLevel__Default=${LOG_LEVEL:-Information}
    ports:
      - "${API_PORT:-5000}:5000"
    volumes:
      - api_logs_staging:/app/logs
      - api_wwwroot_staging:/app/wwwroot
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jnpf-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "${API_CPU_LIMIT:-1.0}"

  # ---------------------------------------------------------------------------
  # PC Admin Frontend (jnpf-web-vue3)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./jnpf-web-vue3
      dockerfile: Dockerfile.staging
      args:
        - VITE_GLOB_API_URL=${VITE_GLOB_API_URL:-/api}
        - VITE_GLOB_WEBSOCKET_URL=${VITE_GLOB_WEBSOCKET_URL:-ws://localhost:5000}
        - VITE_GLOB_APP_TITLE=${VITE_GLOB_APP_TITLE:-JNPF快速开发平台}
    container_name: jnpf-web-staging
    ports:
      - "${VITE_PORT:-3100}:80"
    volumes:
      - ./jnpf-web-vue3/deploy/nginx.staging.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jnpf-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Data Screen Frontend (jnpf-web-datascreen)
  # ---------------------------------------------------------------------------
  datascreen:
    build:
      context: ./jnpf-web-datascreen
      dockerfile: Dockerfile
    container_name: jnpf-datascreen-staging
    ports:
      - "${DATAV_PORT:-8100}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jnpf-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  sqlserver_data_staging:
    driver: local
  redis_data_staging:
    driver: local
  api_logs_staging:
    driver: local
  api_wwwroot_staging:
    driver: local

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  jnpf-staging:
    driver: bridge
    name: jnpf-staging
